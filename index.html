<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adv Accounts lecture list</title>
  <link rel="icon" type="image/png" href="./favicon256.png?v=2">
  <style>
    :root {
      --bg: #0b1325;
      --card-bg: #111e38;
      --card-border: #1d2d52;
      --card-hover: #162646;
      --primary: #0ea5e9;
      --accent-green: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --tag-day: #0284c7;
      --tag-marks: #d97706;
      --tag-badge: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
    }

    /* Header & Progress */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .percentage {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-green);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #1e2d4a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #10b981);
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Section Category Header */
    .section-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 1px;
      margin: 24px 0 14px;
      text-transform: uppercase;
    }

    /* Tracker List & Cards */
    .lecture-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: background-color 0.2s, border-color 0.2s, opacity 0.2s;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: #2b4170;
    }

    .card.completed {
      opacity: 0.75;
      border-color: #1e3a5f;
    }

    .card.completed .card-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Custom Checkbox */
    .checkbox-wrap {
      padding-top: 3px;
    }

    .checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #475569;
      border-radius: 4px;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: all 0.2s ease;
      background: transparent;
    }

    .checkbox:checked {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .checkbox:checked::before {
      content: "";
      width: 5px;
      height: 9px;
      border: solid #0b1325;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    /* Card Content */
    .card-body {
      flex: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .day-pill {
      background-color: var(--tag-day);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.35;
    }

    .card-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--tag-badge);
      color: #cbd5e1;
    }

    .badge-marks {
      background: #78350f;
      color: #fde68a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">

        subtitle: "Amalgamation Intro, Calculation & Discharge of PC, Nature & Accounting",
        duration: "2h 13m",

      {

      },

      {

        duration: "3h 00m",

      },
      {

        duration: "5h 07m",
        marks: null

      {
        id: "day16",
        day: "Day 16",
        title: "Financial Statements of Companies - L1",
        subtitle: "Batch Orientation, Schedule III Statement Format, Revenue from Operations, WIP/FG Inventory",

      {

      {

        duration: "2h 46m",

      },
      {
        id: "day20",

        title: "Cash Flow Statement (L3 & L4) + DPQ + Test 4",
        subtitle: "NPAT from Balance Sheet, Reserves, Direct Method Practice Question",
        duration: "3h 17m",
        marks: null

      {
        id: "day21",
        day: "Day 21",
        title: "AS-2: Valuation of Inventories (L1 & L2) + DPQ",
        subtitle: "Valuation, Cost & NRV, Inclusions/Exclusions, Practice Questions",
        duration: "3h 22m",
        marks: null
      },
      {
        id: "day22",
        day: "Day 22",
        title: "AS-10: Property, Plant & Equipment (L1)",
        subtitle: "Theory & Summary Chart, Cost of PPE including Self-Constructed Assets",
        duration: "2h 44m",
        marks: null
      },
      {
        id: "day23",
        day: "Day 23",
        title: "AS-10 Practice & AS-16 Borrowing Costs (L1) + DPQ",
        subtitle: "AS-10 Questions + AS-16 Qualifying Asset, Capitalization Criteria & Illu 2",
        duration: "3h 24m",
        marks: null
      },
      {
        id: "day24a",
        day: "Day 24",
        title: "AS-16 Practice & AS-26 Intangible Assets (L1)",
        subtitle: "AS-16 Practice (Q7, Q8, Q12) + AS-26 Definition, Recognition Criteria & Acquisition",
        duration: "2h 18m",
        marks: null
      },
      {
        id: "day24b",
        day: "Day 24",
        title: "AS-26 Wrap-up + DPQ + Test 5",
        subtitle: "Research & Development Phase, Amortisation, Impairment & Retirement",
        duration: "0h 58m",
        marks: null
      }
    ];

    const storageKey = "ca_fasttrack_tracker_state";
    let completedItems = JSON.parse(localStorage.getItem(storageKey) || "{}");

    function renderList() {
      const container = document.getElementById("lecture-container");
      container.innerHTML = "";

      lectureData.forEach(item => {
        const isChecked = !!completedItems[item.id];
        const card = document.createElement("div");
        card.className = `card ${isChecked ? "completed" : ""}`;

        card.innerHTML = `
          <div class="checkbox-wrap">
            <input type="checkbox" class="checkbox" id="${item.id}" ${isChecked ? "checked" : ""}>
          </div>
          <div class="card-body">
            <div class="card-top">
              <span class="day-pill">${item.day}</span>
              <span class="card-title">${item.title}</span>
            </div>
            <div class="card-subtitle">${item.subtitle}</div>
            <div class="badges">
              <span class="badge">⏱ ${item.duration}</span>
              ${item.marks ? `<span class="badge badge-marks">★ ${item.marks}</span>` : ""}
            </div>
          </div>
        `;

        card.querySelector(".checkbox").addEventListener("change", (e) => {
          completedItems[item.id] = e.target.checked;
          localStorage.setItem(storageKey, JSON.stringify(completedItems));
          renderList();
        });

        container.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      const total = lectureData.length;
      const done = Object.values(completedItems).filter(Boolean).length;
      const percent = Math.round((done / total) * 100);

      document.getElementById("progress-fill").style.width = `${percent}%`;
      document.getElementById("percent-label").innerText = `${percent}%`;
      document.getElementById("stats-label").innerText = `${done} of ${total} completed`;
    }

    renderList();
  </script>
</body>
</html>
